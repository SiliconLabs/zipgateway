# -*- coding: utf-8 -*-

services:
  dev:
    image: zipgateway-dev
    build:
      context: .
      target: dev
    volumes:
      - .:/usr/local/src/zipgateway
    working_dir: /usr/local/src/zipgateway
    user: "${UID:-1000}:${GID:-1000}"
    stdin_open: true
    tty: true
    command: bash

  runtime:
    build:
      context: .
      target: runtime
    command: tests
    devices:
      - /dev/ttyACM0:/dev/ttyACM0

  # Alias for backward compatibility
  default:
    extends: runtime
